name: Build Otkter site
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Save production build
        uses: actions/upload-artifact@v7
        with:
          name: otkter-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
